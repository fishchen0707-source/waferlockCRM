  cursor:pointer;background:#fff;user-select:none}
.b.on{color:#fff;border-color:transparent}
.b.p.on{background:#10B981}.b.f.on{background:#B91C1C}.b.s.on{background:#94A3B8}
input.n{width:100%;border:1px solid #E2E8F0;border-radius:6px;padding:6px 9px;
  font-size:12.5px;font-family:inherit;margin-top:4px}
input.n:focus{outline:none;border-color:#38BDF8}
button.big{width:100%;min-height:46px;border:none;border-radius:9px;background:#0F2744;
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:5px}
button.g{background:#10B981}
textarea{width:100%;min-height:200px;border:1px solid #E2E8F0;border-radius:7px;padding:9px;
  font-family:ui-monospace,monospace;font-size:11.5px;margin-top:9px}
.warn{background:#FEF3C7;color:#92400E;border-radius:8px;padding:9px 12px;font-size:12.5px;
  margin-bottom:11px}

<div class="hd">
  <h1>內部流程驗收檢查表</h1>
  <p>按單位分。每項都標了<b>用哪個帳號、開哪一頁、預期看到什麼</b>。<br>
  <span style="background:#B91C1C;padding:1px 5px;border-radius:3px">必過</span>
  ＝沒過就不該讓那個單位開始用。</p>
</div>

<div class="warn">
💾 進度會自動存在這台瀏覽器，關掉再開會回到原處，可以分幾天跑。<br>
🔢 建議順序：先跑 A（系統設定），它是其他所有項的前提。
</div>

<div class="bar">
  <div><b id="pg">0 / 0</b> 已判定　·　必過項 <b id="kg">0 / 0</b>　·
    <span style="color:#B91C1C">失敗 <b id="fg">0</b></span></div>
  <div class="track"><div class="fill" id="fl"></div></div>
</div>

<div id="root"></div>

<div class="card">

  <button class="big" onclick="cp()">📄 複製報告</button>
  <button class="big" style="background:#94A3B8" onclick="rst()">🗑 清空進度</button>
</div>

 {t:'清掉測試資料',e:'B 段下的測試單（FC-開頭）、出貨明細對應的列、簽核紀錄可保留當憑證'},
 {t:'DISPATCH_PENDING_SINCE 已改回',e:'如果 A 段測過「待核 0」，確認改回 2026-08-01'},
 {t:'確認 DISPATCH_SHEET_ID 指向正確的表',e:'若之前用副本測，記得指回正式表——忘了會讓主管核到副本上'},

var KEY = 'wf_verify_v1';
var st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { st = {}; }

var root = document.getElementById('root');
var total = 0, ktotal = 0, idx = 0;

DATA.forEach(function (g) {
  var c = document.createElement('div');
  c.className = 'card';
  var h = '<div class="unit">' + g.u +
    '<span class="meta">帳號：' + g.who + '　·　' + g.page + '</span></div>';
  if (g.sub) h += '<div class="usub">' + g.sub + '</div>';
  g.items.forEach(function (it) {
    var i = idx++; total++; if (it.k) ktotal++;
    var v = st['s' + i] || '';
    h += '<div class="it' + (it.k ? ' k' : '') + '">' +
      '<div class="t"><span class="no">' + (i + 1) + '.</span>' + it.t +
      (it.k ? '<span class="kk">必過</span>' : '') + '</div>' +
      '<div class="e">預期：' + it.e + '</div>' +
      '<div class="btns">' +
        '<span class="b p' + (v === 'p' ? ' on' : '') + '" data-i="' + i + '" data-v="p">✓ 通過</span>' +
        '<span class="b f' + (v === 'f' ? ' on' : '') + '" data-i="' + i + '" data-v="f">✗ 失敗</span>' +
        '<span class="b s' + (v === 's' ? ' on' : '') + '" data-i="' + i + '" data-v="s">跳過</span>' +
      '</div>' +
      '<input class="n" id="n' + i + '" placeholder="實際看到什麼／失敗的話寫這裡" value="' +
        String(st['n' + i] || '').replace(/"/g, '&quot;') + '">' +
      '</div>';
  });
  c.innerHTML = h;
  root.appendChild(c);
});

// 攤平成一維，方便產生報告時對回單位
var FLAT = [];
DATA.forEach(function (g) { g.items.forEach(function (it) { FLAT.push({ g: g.u, t: it.t, k: it.k }); }); });

function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

function upd() {
  var done = 0, kdone = 0, fail = 0;
  FLAT.forEach(function (x, i) {
    var v = st['s' + i];
    if (v) done++;
    if (v === 'f') fail++;
    if (x.k && v === 'p') kdone++;
  });
  document.getElementById('pg').textContent = done + ' / ' + total;
  document.getElementById('kg').textContent = kdone + ' / ' + ktotal;
  document.getElementById('fg').textContent = fail;
  document.getElementById('fl').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
}

document.querySelectorAll('.b').forEach(function (el) {
  el.addEventListener('click', function () {
    var i = el.getAttribute('data-i'), v = el.getAttribute('data-v');
    if (st['s' + i] === v) { delete st['s' + i]; } else { st['s' + i] = v; }
    document.querySelectorAll('.b[data-i="' + i + '"]').forEach(function (x) { x.classList.remove('on'); });
    if (st['s' + i]) el.classList.add('on');
    save(); upd();
  });
});
document.querySelectorAll('input.n').forEach(function (el) {
  el.addEventListener('input', function () {
    st['n' + el.id.slice(1)] = el.value; save();
  });
});
upd();

function gen() {
  var L = ['內部流程驗收報告', new Date().toLocaleString('zh-TW'), ''];
  var done = 0, kfail = [], fails = [], notes = [], skips = [];
  FLAT.forEach(function (x, i) {
    var v = st['s' + i], n = (st['n' + i] || '').trim();
    if (v) done++;
    var line = (i + 1) + '. [' + x.g.split('.')[0] + '] ' + x.t + (n ? ' — ' + n : '');
    if (v === 'f') { fails.push(line); if (x.k) kfail.push(line); }
    else if (v === 's') { skips.push(line); }
    else if (n) { notes.push(line + (v === 'p' ? '（通過）' : '（未判定）')); }
  });
  L.push('進度：' + done + ' / ' + total + '　失敗 ' + fails.length +
    '　跳過 ' + skips.length + '　未判定 ' + (total - done));
  L.push('');
  if (kfail.length) {
    L.push('🔴 必過項失敗（' + kfail.length + '）— 這些沒過不該讓對應單位開始用');
    kfail.forEach(function (x) { L.push('  ' + x); }); L.push('');
  }
  var other = fails.filter(function (x) { return kfail.indexOf(x) < 0; });
  if (other.length) {
    L.push('失敗（' + other.length + '）');
    other.forEach(function (x) { L.push('  ' + x); }); L.push('');
  }
  if (skips.length) {
    L.push('跳過（' + skips.length + '）');
    skips.forEach(function (x) { L.push('  ' + x); }); L.push('');
  }
  if (notes.length) {
    L.push('備註（' + notes.length + '）');
    notes.forEach(function (x) { L.push('  ' + x); }); L.push('');
  }
  if (!fails.length && !skips.length && !notes.length) L.push('（沒有失敗、跳過或備註）');
  document.getElementById('out').value = L.join('\n');
  document.getElementById('out').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cp() {
  var t = document.getElementById('out');
  if (!t.value) gen();
  t.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(t.value).then(
      function () { alert('已複製'); }, function () { alert('請手動全選複製'); });
    return;
  }
  alert(ok ? '已複製' : '請手動全選複製');
}

function rst() {
  if (!confirm('清空所有進度？這個動作無法復原。')) return;
  st = {}; save();
  location.reload();
}
</script>
